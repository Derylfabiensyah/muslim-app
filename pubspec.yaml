name: muslim_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^5.2.1
  flutter_compass: ^0.8.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/muslim-logo.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/muslim-logo.png"
