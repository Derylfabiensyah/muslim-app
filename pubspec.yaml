name: muslim_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/Minimalist_Muslim_app_logo,_crescent_202606012017.jpeg
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/Minimalist_Muslim_app_logo,_crescent_202606012017.jpeg"
  adaptive_icon_background: "#546B41"
  adaptive_icon_foreground: "assets/Minimalist_Muslim_app_logo,_crescent_202606012017.jpeg"
